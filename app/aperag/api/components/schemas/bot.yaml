botConfig:
  type: object
  properties:
    agent:
      type: object
      properties:
        completion:
          $ref: './model.yaml#/modelSpec'
        welcome_title:
          type: [string, 'null']
        welcome_subtitle:
          type: [string, 'null']
        system_prompt_template:
          type: string
        query_prompt_template:
          type: string
        collections:
          type: array
          items:
            $ref: './collection.yaml#/collection'
    flow:
      $ref: './flow.yaml#/components/schemas/WorkflowDefinition'
    orchestration:
      anyOf:
        - $ref: './orchestration.yaml#/OrchestrationConfig'
        - type: 'null'


botCreate:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
    type:
      type: string
      enum:
        - knowledge
        - common
        - agent
      description: The type of bot
      example: knowledge
    config:
      $ref: '#/botConfig'
    is_default:
      type: [boolean, 'null']
      default: false
    is_protected:
      type: [boolean, 'null']
      default: false

botUpdate:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    description:
      type: string
    config:
      $ref: '#/botConfig'
    is_default:
      type: [boolean, 'null']
    is_protected:
      type: [boolean, 'null']

bot:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    description:
      type: string
    type:
      type: string
      enum:
        - knowledge
        - common
        - agent
      description: The type of bot
      example: knowledge
    config:
      $ref: '#/botConfig'
    created:
      type: string
      format: date-time
    updated:
      type: string
      format: date-time
    is_default:
      type: [boolean, 'null']
      default: false
      description: Whether this is the default bot
    is_protected:
      type: [boolean, 'null']
      default: false
      description: Whether this bot is protected from deletion

botList:
  type: object
  description: A list of bots
  properties:
    items:
      type: array
      items:
        $ref: '#/bot'
    pageResult:
      $ref: './common.yaml#/pageResult'

debugFlowRequest:
  type: object
  properties:
    query:
      type: string
  required:
    - query
