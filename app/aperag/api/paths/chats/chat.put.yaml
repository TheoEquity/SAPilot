/bots/{bot_id}/chats/{chat_id}:
  put:
    summary: Update a chat
    description: Update a chat
    security:
    - BearerAuth: []
    parameters:
    - name: bot_id
      in: path
      required: true
      schema:
        type: string
    - name: chat_id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/chat.yaml#/chatUpdate
    responses:
      '200':
        description: Chat updated successfully
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/chat.yaml#/chat
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '404':
        description: Chat not found
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
