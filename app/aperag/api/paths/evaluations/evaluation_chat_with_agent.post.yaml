/evaluations/chat_with_agent:
  post:
    tags:
    - evaluation
    summary: (Internal) Chat with an agent for evaluation purposes
    description: 'This is an internal endpoint used by the evaluation service to run
      the agent chat logic in the main FastAPI process, avoiding issues with Celery''s
      execution context. It should be protected by an internal API key.

      '
    operationId: chat_with_agent_for_evaluation_api_v1_evaluations_chat_with_agent_post
    security:
    - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/evaluation.yaml#/EvaluationChatWithAgentRequest
    responses:
      '200':
        description: Successful Response from Agent
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/evaluation.yaml#/EvaluationChatWithAgentResponse
      '401':
        description: Unauthorized
      '422':
        description: Validation Error
