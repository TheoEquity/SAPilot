/question-sets:
  get:
    tags:
    - evaluation
    summary: List all question sets for the current user
    security:
    - BearerAuth: []
    operationId: list_question_sets_api_v1_question_sets_get
    parameters:
    - name: collection_id
      in: query
      required: false
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: page_size
      in: query
      schema:
        type: integer
        default: 10
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/evaluation.yaml#/QuestionSetList
