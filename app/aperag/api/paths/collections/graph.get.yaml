/collections/{collection_id}/graphs:
  get:
    summary: Get knowledge graph
    description: 'Retrieve knowledge graph data. Two modes are supported:

      1. Overview mode (default): Uses the entire graph ("*") and intelligently selects
      the most important nodes

      2. Subgraph mode: When ''label'' is provided, returns a subgraph centered on
      that node


      Node selection prioritization:

      1. For overview: nodes with highest degree (most connections), automatically
      removing isolated nodes

      2. For subgraph: nodes within specified hops from the starting node


      The overview mode is optimized for visualization performance by prioritizing
      well-connected nodes.

      '
    tags:
    - graph
    security:
    - BearerAuth: []
    parameters:
    - name: collection_id
      in: path
      required: true
      schema:
        type: string
      description: Collection ID
    - name: label
      in: query
      required: false
      schema:
        type: string
        default: '*'
      description: 'Label of the starting node for subgraph exploration.

        Use "*" (default) for overview mode showing the most important nodes in the
        entire graph.

        Provide a specific entity name for subgraph mode.

        '
      example: 墨香居
    - name: max_nodes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
      description: Maximum number of nodes to return
      example: 1000
    - name: max_depth
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 3
      description: 'Maximum depth when in subgraph mode (when specific label is provided).

        Ignored in overview mode (when label is "*").

        '
      example: 3
    responses:
      '200':
        description: Knowledge graph retrieved successfully
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/graph.yaml#/knowledgeGraph
      '400':
        description: Bad request - invalid parameters
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '404':
        description: Collection not found or label not found in graph
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
