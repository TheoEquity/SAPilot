/collections/{collection_id}/documents/{document_id}/preview:
  get:
    summary: Get document preview
    description: Get a preview of a specific document
    operationId: get_document_preview
    security:
    - BearerAuth: []
    parameters:
    - name: collection_id
      in: path
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Document preview
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/document.yaml#/documentPreview
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '404':
        description: Document not found
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
