/marketplace/collections/{collection_id}/documents:
  get:
    summary: List documents in MarketplaceCollection (read-only)
    description: Get document list for a subscribed Collection (read-only mode) with pagination, sorting and search capabilities
    parameters:
    - name: collection_id
      in: path
      required: true
      description: Collection ID
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    - name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of items per page
    - name: sort_by
      in: query
      schema:
        type: string
        enum:
        - name
        - created
        - updated
        - size
        - status
      description: Field to sort by
    - name: sort_order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      description: Sort order
    - name: search
      in: query
      schema:
        type: string
      description: Search documents by name
    responses:
      '200':
        description: Document list (read-only)
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/document.yaml#/documentList
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '403':
        description: Access denied (need subscription)
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '404':
        description: Collection not found
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
