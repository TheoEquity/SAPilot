/llm_providers/{provider_name}/models/{api}/{model}:
  put:
    summary: Update a provider model
    description: Update a specific model of a provider
    parameters:
    - name: provider_name
      in: path
      required: true
      schema:
        type: string
      description: Provider name
    - name: api
      in: path
      required: true
      schema:
        type: string
        enum:
        - completion
        - embedding
        - rerank
      description: API type
    - name: model
      in: path
      required: true
      schema:
        type: string
      description: Model name (supports names with slashes, will be URL decoded)
      style: simple
      explode: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/model.yaml#/llmProviderModelUpdate
    responses:
      '200':
        description: Model updated successfully
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/model.yaml#/llmProviderModel
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
      '404':
        description: Model not found
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/common.yaml#/failResponse
