name: Test branch checks

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: test-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Conventions and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install static checker
        run: python -m pip install ruff==0.17.3
      - name: Install locked frontend dependencies
        run: yarn --cwd web install --frozen-lockfile --non-interactive
      - name: Backend static checks
        run: python -m ruff check aperag scripts/export_openapi.py
      - name: Frontend types
        run: yarn --cwd web typecheck
      - name: Frontend conventions
        run: yarn --cwd web lint
